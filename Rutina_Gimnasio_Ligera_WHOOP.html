function render(){document.getElementById('tabs').innerHTML=DAYS.map((d,i)=>`<button class="${i===day?'active':''}" onclick="switchDay(${i})">Día ${i+1}</button>`).join('');let d=DAYS[day];let html=`<div class="meta"><strong>${d.title}</strong><span class="pill">Máx. 45 min</span></div><div class="card"><div class="time"><div><label>Inicio</label><input type="time" value="${get('d'+day+'start')}" onchange="set('d${day}start',this.value)"></div><div><label>Final</label><input type="time" value="${get('d'+day+'end')}" onchange="set('d${day}end',this.value)"></div></div><p id="saved">✓ Guardado en este dispositivo</p><div class="stats" id="stats"></div><div class="progress"><div id="bar"></div></div></div><div class="card"><label class="check"><input type="checkbox" ${get('d'+day+'warm',false)?'checked':''} onchange="set('d${day}warm',this.checked)"><b>Calentamiento · 5 min</b></label><p>${d.warm}</p></div>`;d.ex.forEach((e,i)=>{let count=get(`d${day}e${i}count`,e[1]);html+=`<div class="card"><div class="exercise"><div class="art">${pic(day,i)}</div><div><div class="name">${i+1}. ${e[0]}</div><div class="hint">${e[1]} series × ${e[2]}<br>${e[3]}</div></div></div><div style="margin-top:13px">`;for(let j=0;j<count;j++){let k=`d${day}e${i}s${j}`;html+=`<div class="set"><div class="setnum">S${j+1}</div><div><label>${e[4]==='plank'?'Segundos':'Reps'}</label><input type="number" inputmode="numeric" min="0" value="${get(k+'r')}" oninput="set('${k}r',this.value)"></div><div><label>Peso (lb)</label><input type="number" inputmode="decimal" min="0" step="any" value="${get(k+'w')}" oninput="set('${k}w',this.value)"></div><div><label>✓</label><input type="checkbox" ${get(k+'done',false)?'checked':''} onchange="set('${k}done',this.checked)"></div></div>`}html+=`</div><div class="controls"><button onclick="changeCount(${i},1)">＋ Agregar serie</button>${count>e[1]?`<button onclick="changeCount(${i},-1)">− Quitar última</button>`:''}</div></div>`});html+=`<div class="card"><label class="check"><input type="checkbox" ${get('d'+day+'cardio',false)?'checked':''} onchange="set('d${day}cardio',this.checked)"><b>Cardio final · 5 min</b></label><p>${d.cardio}</p></div><div class="actions"><button class="primary" onclick="backup()">📋 Copiar respaldo / WHOOP</button><button onclick="download()">⬇ Descargar respaldo (.txt)</button><button class="danger" onclick="resetDay()">Reiniciar este día</button></div><p class="note">Versión con imágenes fotográficas integradas. Los datos se guardan automáticamente en el almacenamiento de este navegador al escribir o marcar una serie. No se sincronizan entre dispositivos y pueden perderse si borras los datos del navegador, usas navegación privada o abres el archivo en otra app. Copia un respaldo al finalizar cada ejercicio. Las fotografías de referencia están integradas y funcionan sin internet. Son imágenes generadas para ilustrar los movimientos, no fotografías del gimnasio real; verifica la técnica con un entrenador.</p>`;document.getElementById('app').innerHTML=html;progress()}
function progress(){let d=DAYS[day],total=0,done=0;d.ex.forEach((e,i)=>{let n=get(`d${day}e${i}count`,e[1]);for(let j=0;j<n;j++){total++;if(get(`d${day}e${i}s${j}done`,false))done++}});let st=document.getElementById('stats'),bar=document.getElementById('bar');if(st)st.textContent=`${done} de ${total} series completadas`;if(bar)bar.style.width=(total?done/total*100:0)+'%'}function switchDay(i){day=i;save();render()}function changeCount(i,n){let k=`d${day}e${i}count`;db[k]=Math.max(DAYS[day].ex[i][1],get(k,DAYS[day].ex[i][1])+n);save();render()}function record(){let d=DAYS[day],s=[`WHOOP · Día ${day+1} · ${d.title}`,`Fecha: ${new Date().toLocaleDateString('es-DO')}`,`Inicio: ${get('d'+day+'start','Pendiente')}`,`Final: ${get('d'+day+'end','Pendiente')}`,`Calentamiento: ${get('d'+day+'warm',false)?'Sí':'Pendiente'}`];d.ex.forEach((e,i)=>{s.push('',`${i+1}. ${e[0]} (objetivo ${e[2]})`);for(let j=0;j<get(`d${day}e${i}count`,e[1]);j++){let k=`d${day}e${i}s${j}`;s.push(`Serie ${j+1}: ${get(k+'r','—')} ${e[4]==='plank'?'seg':'reps'} · ${get(k+'w','—')} lb · ${get(k+'done',false)?'Completada':'Pendiente'}`)}});s.push('',`Cardio: ${get('d'+day+'cardio',false)?'Sí':'Pendiente'}`);return s.join('\n')}async function backup(){const t=record();try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error('clipboard unavailable');await navigator.clipboard.writeText(t);alert('Registro completo copiado. Pégalo en ChatGPT.');return}catch(e){}const box=document.getElementById('backup-text');if(box){box.style.display='block';box.value=t;box.focus();box.select();box.setSelectionRange(0,t.length);try{if(document.execCommand('copy')){alert('Registro completo copiado. Pégalo en ChatGPT.');return}}catch(e){}alert('Selecciona y copia el texto que aparece debajo del botón.')}else prompt('Copia tu registro:',t)}function download(){let blob=new Blob([record()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`rutina-dia-${day+1}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function resetDay(){if(!confirm('¿Borrar los registros de este día? Esta acción no se puede deshacer.'))return;Object.keys(db).filter(k=>k.startsWith('d'+day)).forEach(k=>delete db[k]);save();render()}render();
</script><section class="card"><strong>Respaldo WHOOP</strong><p>Si la copia automática falla, selecciona y copia el texto de abajo.</p><textarea id="backup-text" readonly style="display:none;height:220px"></textarea></section></body></html>
